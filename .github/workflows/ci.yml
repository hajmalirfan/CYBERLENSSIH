name: SecuriX Unified CI/CD & Security Gates

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pytest httpx kafka-python psycopg2-binary python-jose[cryptography] numpy

      - name: Run Pytest Across All Services
        run: |
          python -m pytest --import-mode=importlib \
            backend/services/semgrep-service/tests \
            backend/services/checkov-service/tests \
            backend/services/cosign-service/tests \
            backend/services/falco-service/tests \
            backend/services/suricata-service/tests \
            backend/services/zap-service/tests \
            backend/services/graph-service/tests \
            backend/services/temporal-orchestrator/tests \
            backend/services/agent-mesh/tests \
            backend/services/evidence-generator/tests \
            frontend/tests \
            -v

  security-gates:
    name: Security Build Gates (Gitleaks, Semgrep, Checkov, Trivy)
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate 1 - Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Gate 2 - Semgrep SAST Code Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
        continue-on-error: true

      - name: Gate 3 - Checkov IaC Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform,dockerfile
          output_format: cli
          soft_fail: true

      - name: Gate 4 - Trivy Vulnerability & SCA Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  docker-build-verification:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build graph-service
        run: docker build -t securix/graph-service:ci -f backend/services/graph-service/Dockerfile backend

      - name: Build temporal-orchestrator
        run: docker build -t securix/temporal-orchestrator:ci -f backend/services/temporal-orchestrator/Dockerfile backend

      - name: Build agent-mesh
        run: docker build -t securix/agent-mesh:ci -f backend/services/agent-mesh/Dockerfile backend

      - name: Build evidence-generator
        run: docker build -t securix/evidence-generator:ci -f backend/services/evidence-generator/Dockerfile backend
