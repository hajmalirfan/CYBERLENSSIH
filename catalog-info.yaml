apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: securix-platform
  title: SecuriX Cyber Risk Quantification Platform
  description: Real-time risk quantification, compliance verification, and multi-scanner orchestration.
spec:
  owner: SecOps

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: graph-service
  title: SecuriX Graph Service & Knowledge Graph
  description: Kafka consumer bridging scan findings into PostgreSQL + Apache AGE.
spec:
  type: service
  lifecycle: production
  owner: Member-3
  system: securix-platform
  providesApis:
    - graph-query-api

